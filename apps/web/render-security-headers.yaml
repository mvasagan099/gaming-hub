# Merge these fields into the EXISTING static site's Blueprint, or enter them
# under Render Dashboard -> Headers. This fragment does not deploy a service.
headers:
  - path: /*
    name: X-Content-Type-Options
    value: nosniff
  - path: /*
    name: X-Frame-Options
    value: DENY
  - path: /*
    name: Referrer-Policy
    value: no-referrer
  - path: /*
    name: Permissions-Policy
    value: camera=(), microphone=(), geolocation=(), payment=()
  - path: /*
    name: Content-Security-Policy
    value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
  - path: /*
    name: Content-Security-Policy-Report-Only
    value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
