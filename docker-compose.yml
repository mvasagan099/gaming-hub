services:
  postgres:
    image: postgres:16-alpine
    container_name: gaming-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gaming
      POSTGRES_PASSWORD: gaming
      POSTGRES_DB: gaming_hub
    ports:
      - "5540:5432"
    volumes:
      - gaming_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaming -d gaming_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gaming-hub-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    volumes:
      - gaming_hub_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gaming_hub_pgdata:
  gaming_hub_redisdata:
